<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portrait</title>
<style>
    @font-face {
        font-family: "TwinMarker";
        src: url("{{ url_for('static', filename='fonts/TwinMarker.ttf') }}?v={{ asset_version('fonts/TwinMarker.ttf') }}") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: block;
    }
    html, body { margin: 0; padding: 0; background: transparent !important; overflow: hidden; height: 100%; }   /* height: o nome da perícia fica abaixo da foto e não pode ser cortado */
    /* A TwinMarker não tem letras acentuadas: elas caem automaticamente na fonte seguinte da lista. */
    body { font-family: "TwinMarker", "Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-synthesis: none; color: #f5f5f5; }

    #portrait { display: none; align-items: center; gap: 16px; padding: 10px; width: max-content; max-width: 100vw; box-sizing: border-box; }
    #portrait.ready { display: flex; }
    #portrait.v { flex-direction: column; text-align: center; }

    .avatar-wrap { flex: 0 0 auto; width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--c, #c62f27);
        box-shadow: 0 0 18px rgba(0,0,0,.6), 0 0 14px var(--c, #c62f27); background: #111; overflow: hidden;
        display: flex; align-items: center; justify-content: center; }
    .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-wrap .initial { font-size: 76px; font-weight: normal; color: var(--c, #c62f27); }

    .info { display: flex; flex-direction: column; gap: 6px; min-width: 260px; }
    /* nome + símbolo da afinidade elemental logo à direita */
    .name-row { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; }
    .name-row .name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* nome longo corta com "…" em vez de quebrar linha e empurrar o símbolo para fora */
    #portrait.v .name-row { justify-content: center; }
    .elem { width: 34px; height: 34px; flex: 0 0 auto; fill: currentColor; filter: drop-shadow(0 2px 4px #000); }
    .elem.dark { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px rgba(255,255,255,.7)); }   /* Morte é quase preto: brilho claro para aparecer */
    .name { font-size: 36px; font-weight: normal; letter-spacing: .5px; text-shadow: 0 2px 6px #000, 0 0 3px #000; }
    .sub, .nex { font-size: 22px; font-weight: normal; text-shadow: 0 1px 4px #000, 0 0 2px #000; }
    /* NEX: o número da fonte do portrait é pequeno e fino, então ele fica maior, com contorno escuro e a cor do título nunca some no fundo */
    .nex { display: flex; align-items: baseline; gap: 6px; white-space: nowrap;
        text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 4px #000, 0 2px 6px #000; }
    /* Os dígitos da fonte do portrait (TwinMarker) são minúsculos e finos mesmo em tamanho grande,
       então o valor do NEX usa uma fonte de sistema em negrito, que fica nítida em qualquer fundo. */
    .nex .nex-v { font-family: "Segoe UI", "Arial Black", Arial, system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1;
        letter-spacing: .5px; -webkit-text-stroke: 3px rgba(0,0,0,.8); paint-order: stroke fill; }
    /* título do jogador e chip de estado lado a lado */
    .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
    #portrait.v .title-row { justify-content: center; }
    .state { font-size: 18px; font-weight: normal; padding: 2px 10px; border-radius: 999px;
        background: rgba(0,0,0,.65); border: 1px solid currentColor; text-transform: uppercase; letter-spacing: .6px; }

    /* Só o número, em branco, com sombra projetada na cor do status */
    .bars { display: flex; flex-direction: column; gap: 2px; }
    #portrait.v .bars { align-items: center; }
    .stat { --sc: #fff; line-height: 1.05; }
    .stat .val { display: block; font-size: 36px; font-weight: normal; letter-spacing: 1px; color: #fff; white-space: nowrap;
        text-shadow: 0 0 3px var(--sc), 0 0 10px var(--sc); }
    .stat.pv { --sc: #e0443b; }
    .stat.sa { --sc: #4aa3ff; }
    .stat.pe { --sc: #ffc247; }
    .stat.low .val { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }

    .hide { display: none !important; }

    /* ---- Dado animado: só aparece quando o jogador usa um comando de rolagem no chat ---- */
    #portrait { position: relative; }
    .avatar-wrap { transition: opacity .25s ease; }
    #portrait.rolling .avatar-wrap { opacity: .25; }   /* a foto escurece para o dado aparecer bem */
    #dice-fx { position: absolute; left: 0; top: 0; width: 190px; height: 190px; z-index: 5; pointer-events: none;
        opacity: 0; transition: opacity .15s ease; }
    #dice-fx.show { opacity: 1; }
    #dice-fx.show.out { opacity: 0; transition: opacity .5s ease; }
    #dice-fx video { width: 100%; height: 100%; display: block; }
    /* O número fica no centro da face do dado (47% da altura = centro do triângulo da frente) */
    #dice-num { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%) scale(.5); opacity: 0;
        font-size: 64px; line-height: 1; color: #fff; white-space: nowrap; letter-spacing: 1px;
        text-shadow: 0 0 4px var(--c, #c62f27), 0 0 12px var(--c, #c62f27), 0 2px 5px #000;
        transition: opacity .25s ease, transform .3s cubic-bezier(.2, 1.5, .4, 1); }
    #dice-fx.num #dice-num { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* ---- Nome da perícia rolada: aparece logo abaixo da foto ---- */
    #skill-tag { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; max-width: 320px; box-sizing: border-box;
        padding: 3px 14px; border-radius: 999px; background: rgba(0,0,0,.7); border: 2px solid var(--c, #c62f27);
        box-shadow: 0 0 10px var(--c, #c62f27); font-size: 24px; line-height: 1.2; color: #fff; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: .6px;
        text-shadow: 0 1px 4px #000; opacity: 0; transform: translateY(-6px); transition: opacity .25s ease, transform .25s ease; }
    #skill-tag.show { opacity: 1; transform: translateY(0); }
    #skill-tag.cmd { text-transform: none; letter-spacing: .3px; }   /* comando do chat: mostra como foi digitado (/d20) */
    /* No layout vertical o nome do agente fica logo abaixo da foto: ele esmaece enquanto a perícia aparece */
    #portrait.v .name-row { transition: opacity .2s ease; }
    #portrait.v.tagging .name-row { opacity: 0; }
</style>
</head>
<body>
<div id="portrait">
    <div class="avatar-wrap" id="avatar"></div>
    <div class="info">
        <div class="name-row" id="name-row">
            <div class="name" id="name"></div>
            <svg class="elem hide" id="elem" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
        </div>
        <div class="title-row" id="title-row">
            <div class="sub" id="sub"></div>
            <div class="nex hide" id="nex"><span class="nex-l">NEX</span><span class="nex-v" id="nex-v"></span></div>
            <div class="state hide" id="state"></div>
        </div>
        <div class="bars">
            <div class="stat pv" id="bar-pv"><span class="val"></span></div>
            <div class="stat sa" id="bar-sa"><span class="val"></span></div>
            <div class="stat pe" id="bar-pe"><span class="val"></span></div>
        </div>
    </div>
    <div id="dice-fx" aria-hidden="true">
        <video id="dice-video" muted playsinline preload="auto"
               src="{{ url_for('_serve_dice_roll_video') }}?v={{ asset_version('dice/d20_roll.webm') }}"></video>
        <div id="dice-num"></div>
    </div>
    <div id="skill-tag" aria-hidden="true"></div>
</div>
<script>
(function() {
    var DATA_URL = {{ url_for('portrait_stream_data', token=token)|tojson }};
    var q = new URLSearchParams(location.search);
    var DEFAULTS = { f: '1', n: '1', t: '1', s: '1', pv: '1', x: '0', e: '1', l: 'h' };
    var saved = {};   // opções salvas no site (botão Salvar); o que vier no link tem prioridade
    function opt(k) {
        if (q.has(k)) return q.get(k);
        return (k in saved) ? saved[k] : DEFAULTS[k];
    }
    var on = function(k) { return opt(k) !== '0'; };   // tudo é exibido, a menos que seja 0

    var root = document.getElementById('portrait');

    var ELEMENT_ICONS = {{ element_icons|tojson }};
    var el = {
        avatar: document.getElementById('avatar'), name: document.getElementById('name'),
        nameRow: document.getElementById('name-row'), elem: document.getElementById('elem'),
        sub: document.getElementById('sub'), nex: document.getElementById('nex'), state: document.getElementById('state'),
        pv: document.getElementById('bar-pv'), sa: document.getElementById('bar-sa'), pe: document.getElementById('bar-pe')
    };

    function setBar(node, cur, max, label, show) {
        node.classList.toggle('hide', !show);
        if (!show) return;
        var pct = max > 0 ? Math.max(0, Math.min(100, cur / max * 100)) : 0;
        node.querySelector('.val').textContent = cur + ' / ' + max;
        node.classList.toggle('low', pct <= 25);
    }

    var lastAvatar = null;
    function render(d) {
        saved = d.opts || {};
        root.classList.toggle('v', opt('l') === 'v');
        el.avatar.classList.toggle('hide', !on('f'));
        el.nameRow.classList.toggle('hide', !on('n'));

        root.style.setProperty('--c', d.color);
        el.name.textContent = d.name;

        // Símbolo da afinidade elemental (só aparece com afinidade escolhida e NEX >= 50%)
        var icon = (d.element && on('e')) ? ELEMENT_ICONS[d.element] : '';   // opção "Afinidade" da aba Portrait (?e=0 desliga)
        if (icon) {
            if (el.elem.getAttribute('data-el') !== d.element) { el.elem.innerHTML = icon; el.elem.setAttribute('data-el', d.element); }
            el.elem.style.color = d.element_color || '#fff';
            el.elem.classList.toggle('dark', d.element === 'morte');
            el.elem.classList.remove('hide');
        } else {
            el.elem.classList.add('hide'); el.elem.removeAttribute('data-el'); el.elem.innerHTML = '';
        }

        var parts = [];
        if (d.title) parts.push(d.title);
        el.sub.textContent = parts.join(' - ');
        el.sub.style.color = d.title_color;
        el.sub.classList.toggle('hide', !on('t') || !parts.length);

        // NEX é opcional: só aparece se estiver ligado (salvo no site ou ?x=1) (fica entre o título e o chip de estado)
        document.getElementById('nex-v').textContent = d.nex ? d.nex + '%' : '';
        el.nex.style.color = d.title_color;
        el.nex.classList.toggle('hide', opt('x') !== '1' || !d.nex);

        el.state.textContent = d.state;
        el.state.style.color = d.state_color || '#f5f5f5';
        el.state.classList.toggle('hide', !on('s') || !d.state);
        document.getElementById('title-row').classList.toggle('hide',
            el.sub.classList.contains('hide') && el.nex.classList.contains('hide') && el.state.classList.contains('hide'));

        if (lastAvatar !== d.avatar_url) {
            lastAvatar = d.avatar_url;
            el.avatar.innerHTML = '';
            if (d.avatar_url) {
                var img = new Image();
                img.alt = '';
                img.src = d.avatar_url;
                el.avatar.appendChild(img);
            } else {
                var s = document.createElement('span');
                s.className = 'initial';
                s.textContent = (d.name || '?').trim().charAt(0).toUpperCase();
                el.avatar.appendChild(s);
            }
        }

        setBar(el.pv, d.pv, d.pv_max, 'PV', on('pv'));
        // Automático: Sanidade ligada => PV + SAN + PE; Sanidade desligada => PV + PD.
        setBar(el.sa, d.sanidade, d.sanidade_max, 'SAN', !d.sem_sanidade);
        setBar(el.pe, d.pe, d.pe_max, d.pe_label, true);
        root.classList.add('ready');
    }

    function tick() {
        fetch(DATA_URL, { cache: 'no-store' })
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(d) { if (d && d.ok) render(d); })
            .catch(function() { /* mantém o último estado exibido */ });
    }
    tick();
    setInterval(tick, 2000);

    // ---- Dado: toca o vídeo quando o jogador usa um comando de rolagem no chat ----
    var DICE_URL = {{ url_for('portrait_stream_dice', token=token)|tojson }};
    var SETTLE_MS = 1300;   // o dado para de rolar em ~1,25 s: aí o número aparece
    var HOLD_MS = 3200;     // quanto tempo o resultado fica na tela
    var OUT_MS = 500;       // tempo do esmaecer final
    var fx = document.getElementById('dice-fx');
    var vid = document.getElementById('dice-video');
    var numEl = document.getElementById('dice-num');
    var lastDice = null, queue = [], playing = false;

    // Centraliza o dado sobre a foto (ou no meio do portrait, se a foto estiver desligada)
    function placeFx() {
        var rr = root.getBoundingClientRect();
        var r = el.avatar.classList.contains('hide') ? rr : el.avatar.getBoundingClientRect();
        fx.style.left = (r.left - rr.left + r.width / 2 - fx.offsetWidth / 2) + 'px';
        fx.style.top = (r.top - rr.top + r.height / 2 - fx.offsetHeight / 2) + 'px';
    }

    function nextDice() {
        if (playing || !queue.length || !root.classList.contains('ready')) return;
        playDice(queue.shift());
    }

    // item = { num: número que aparece no dado, name: nome da perícia (opcional) }
    function playDice(item) {
        playing = true;
        placeFx();
        if (item.name) showSkill(item.name, SETTLE_MS + HOLD_MS + OUT_MS, item.cmd);   // a etiqueta acompanha o dado
        var txt = String(item.num);
        numEl.textContent = txt;
        numEl.style.fontSize = (txt.length <= 2 ? 64 : txt.length === 3 ? 48 : 34) + 'px';
        fx.classList.remove('num', 'out');
        root.classList.add('rolling');
        fx.classList.add('show');

        function schedule() {
            setTimeout(function() { fx.classList.add('num'); }, SETTLE_MS);
            setTimeout(function() { fx.classList.add('out'); root.classList.remove('rolling'); }, SETTLE_MS + HOLD_MS);
            setTimeout(function() {
                fx.classList.remove('show', 'out', 'num');
                try { vid.pause(); } catch (e) {}
                playing = false;
                nextDice();
            }, SETTLE_MS + HOLD_MS + OUT_MS + 60);
        }
        try { vid.currentTime = 0; } catch (e) {}
        var p = vid.play();
        if (p && p.then) p.then(schedule, schedule); else schedule();   // se o vídeo falhar, o número aparece mesmo assim
    }

    // ---- Perícia: mostra o nome logo abaixo da foto por alguns segundos ----
    var SKILL_MS = 4000;
    var tag = document.getElementById('skill-tag');
    var lastSkill = null, skillTimer = null;

    function showSkill(name, ms, isCmd) {
        tag.textContent = name;
        tag.classList.toggle('cmd', !!isCmd);
        var rr = root.getBoundingClientRect();
        var r = el.avatar.classList.contains('hide') ? rr : el.avatar.getBoundingClientRect();
        var w = tag.offsetWidth;
        var left = r.left - rr.left + r.width / 2 - w / 2;
        left = Math.max(2 - rr.left, Math.min(left, window.innerWidth - w - 2 - rr.left));   // não sai da tela do OBS
        tag.style.left = left + 'px';
        tag.style.top = (r.bottom - rr.top + 6) + 'px';
        tag.classList.add('show');
        root.classList.add('tagging');
        clearTimeout(skillTimer);
        skillTimer = setTimeout(function() { tag.classList.remove('show'); root.classList.remove('tagging'); }, ms || SKILL_MS);
    }

    // Uma consulta por vez: se a resposta demorar mais que o intervalo, a consulta seguinte
    // usaria o mesmo "after" e a mesma rolagem seria enfileirada duas vezes (o dado tocava 2x).
    var polling = false;

    function pollDice() {
        if (polling) return;
        polling = true;
        var url = DICE_URL + '?' + (lastDice === null ? '' : 'after=' + lastDice + '&') + (lastSkill === null ? '' : 'sk_after=' + lastSkill);
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var killer = setTimeout(function() { if (ctl) ctl.abort(); }, 6000);   // resposta que trava não pode parar o dado para sempre
        fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
            .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
            .then(function(d) {
                if (!d || !d.ok) return;
                var prevDice = lastDice, prevSkill = lastSkill;
                if (prevDice !== null) {
                    (d.events || []).forEach(function(e) {
                        if (e.id > prevDice) queue.push({ num: e.total, name: e.label, cmd: true });   // cada rolagem entra uma única vez; o comando usado aparece abaixo da foto
                    });
                }
                lastDice = Math.max(prevDice === null ? 0 : prevDice, d.last_id);   // 1ª consulta: só marca o ponto de partida (não repete rolagens antigas)
                if (prevSkill !== null && d.skills && root.classList.contains('ready')) {
                    // perícia: o dado rola com o total da perícia e o nome fica abaixo da foto
                    d.skills.forEach(function(sk) {
                        if (sk.id > prevSkill) queue.push({ num: sk.die, name: sk.name });
                    });
                }
                if (typeof d.last_skill_id === 'number') lastSkill = Math.max(prevSkill === null ? 0 : prevSkill, d.last_skill_id);
                while (queue.length > 3) queue.shift();
                nextDice();
            })
            .catch(function() { /* tenta de novo no próximo ciclo */ })
            .then(function() { clearTimeout(killer); polling = false; });
    }
    pollDice();
    setInterval(pollDice, 800);
})();
</script>
</body>
</html>
